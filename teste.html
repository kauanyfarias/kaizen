<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css">
    
    <style>
        body{
            margin: 0;
        }
        #barra-lateral{
            background-color: #353535;
            width: 200px;
            height: 100vh;
            position: fixed;
            left: -200px;
            transition: left 0.3s ease;
            z-index: 10;
        }
        #barra-lateral.aberta{
            left: 0;
        }
        img{
            width: 180px;
        }
        main,header{
            background-color: #3b3b3b;
            font-size: 200px;
            z-index: 5;
        }
        #overlay{
            transition: inset 0.4s ease;
        }
        #overlay.ativado{
            position: fixed;
            inset: 0;
            transition: left 0.4s ease;
            background-color: rgba(0, 0, 0, 0.4); 
        }
        
    </style>
    
</head>
    
<body>
    <aside >
        <nav id="barra-lateral">
            <!-- LOGO DA KAIZEN -->  
            <a href="home.html"><img src="imagens/logo.png" alt="Logo marca Kaizen"></a>
            
            <!-- Botões de interatividade -->
            <div id="botoes-interatividade" style="color: white;">
                <span class="fi fi-sr-exchange"></span>
                <span class="fi fi-sr-brightness"></span>
            </div>

            <ul><!-- NAVEGAÇÃO DE PÁGINAS -->
                <a href="teste.html">
                    <li><span class="fi fi-rr-house-chimney"></span>Início</li>
                </a>
                <a href="teste.html">
                    <li><span class="fi fi-rs-arrow-trend-up"></span>Fluxo de Caixa</li>
                </a>
                <a href="teste.html">
                    <li><span class="fi fi-rs-chart-pie-alt"></span>Gráficos</li>
                </a>
                <a href="teste.html">
                    <li><span class="fi fi-rs-pig"></span>Investimentos</li>
                </a>
                <a href="teste.html">
                    <li><span class="fi fi-rr-calculator"></span>Calculadora</li>
                </a>
                <a href="teste.html">
                    <li><span class="fi fi-rs-users-alt"></span>Gestão de equipe</li>
                </a>
            </ul>
            <ul> <!-- CONFIGURAÇÕES E SAÍDA -->
                <a href="teste.html">
                    <li><span class="fi fi-rr-settings"></span>Configurações</li>
                </a>
                <a href="teste.html">
                    <li><span class="fi fi-rs-exit"></span>Sair</li>
                </a>
            </ul>
        </nav>
    </aside>
    <header>
        <button id="botao-menu"><span >☰</span></button>
    </header>
    <main >
        <p>uhul</p>
    </main>
    <div id="overlay"></div>
    <script>
        const botaoMenu = document.getElementById('botao-menu')
        const barraLateral = document.getElementById('barra-lateral')
        const overlay = document.getElementById('overlay')

        botaoMenu.addEventListener ('click', function() {
            barraLateral.classList.toggle('aberta')
            overlay.classList.toggle('ativado')
        })

        overlay.addEventListener ('click', function(){
            barraLateral.classList.remove('aberta')
            overlay.classList.remove('ativado')
        })
        
        

    </script>
</body>
</html>
